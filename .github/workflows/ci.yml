name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: Rodar evals com LLM real
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mcp-server:
    name: MCP server (lint + testes + integração)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes com Postgres real
        run: docker compose --profile test run --rm --build mcp-test
      - name: Derrubar ambiente
        if: always()
        run: docker compose --profile test down -v

  api:
    name: API do agente (lint + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: docker compose --profile test run --rm --build --no-deps api-test

  web:
    name: Front-end (typecheck + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: docker compose --profile test run --rm --build --no-deps web-test

  smoke:
    name: Smoke test da stack completa
    runs-on: ubuntu-latest
    needs: [mcp-server, api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Subir stack
        run: docker compose up -d --build --wait
      - name: Front e API respondendo pelo nginx
        run: |
          curl --fail --silent http://localhost:8080/ | grep -q "<title>InsightQL</title>"
          curl --fail --silent http://localhost:8080/health | grep -q '"ok"'
      - name: MCP server respondendo pela API
        run: |
          docker compose exec -T api python -c "
          import asyncio
          from insightql_api.infrastructure.mcp_gateway import open_mcp_gateway
          async def main():
              async with open_mcp_gateway('http://mcp-server:8001/mcp') as gateway:
                  tools = {t.name for t in await gateway.list_tools()}
                  assert tools == {'list_tables', 'describe_table', 'run_query'}, tools
                  blocked = await gateway.call('run_query', {'sql': 'DELETE FROM orders'})
                  assert not blocked.ok
          asyncio.run(main())
          "
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v

  evals:
    name: Evals do agente (LLM real)
    runs-on: ubuntu-latest
    needs: [smoke]
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar segredo
        run: test -n "$LLM_API_KEY" || (echo "Configure o secret LLM_API_KEY" && exit 1)
      - name: Rodar evals
        run: docker compose --profile evals run --rm --build evals
      - name: Derrubar ambiente
        if: always()
        run: docker compose --profile evals down -v

  publish:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-latest
    needs: [smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [mcp-server, api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome da imagem em minúsculas
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
