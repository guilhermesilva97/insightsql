name: insightql

x-reader-url: &reader-url ${DATABASE_URL:-postgresql+psycopg://insightql_reader:reader@postgres:5432/insightql}

x-llm-env: &llm-env
  MCP_SERVER_URL: http://mcp-server:8001/mcp
  LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
  LLM_API_KEY: ${LLM_API_KEY:-ollama}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insightql
      POSTGRES_USER: insightql
      POSTGRES_PASSWORD: insightql
    volumes:
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightql -d insightql"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_DATABASE: insightql
      MYSQL_ROOT_PASSWORD: insightql
    volumes:
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pinsightql --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mcp-server:
    build:
      context: ./mcp-server
      target: runtime
    environment:
      DATABASE_URL: *reader-url
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: ./api
      target: runtime
    environment: *llm-env
    depends_on:
      - mcp-server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      target: runtime
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: [local-llm]
    volumes:
      - ollama-models:/root/.ollama

  ollama-pull:
    image: ollama/ollama:latest
    profiles: [local-llm]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-qwen2.5:7b}"]
    depends_on:
      - ollama

  mcp-test:
    build:
      context: ./mcp-server
      target: test
    profiles: [test]
    environment:
      DATABASE_URL: postgresql+psycopg://insightql_reader:reader@postgres:5432/insightql
    depends_on:
      postgres:
        condition: service_healthy

  api-test:
    build:
      context: ./api
      target: test
    profiles: [test]

  web-test:
    build:
      context: ./web
      target: test
    profiles: [test]

  evals:
    build:
      context: ./api
      target: evals
    profiles: [evals]
    environment:
      <<: *llm-env
      EVALS_MIN_ACCURACY: ${EVALS_MIN_ACCURACY:-0.75}
    depends_on:
      - mcp-server

volumes:
  postgres-data:
  ollama-models:
